<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Empresa Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="container-header">
            <h1>Empresa<span>Web</span></h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="servicios.html">Servicios</a>
                <a href="contacto.html" class="active">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container-contacto">
            <section class="contacto-wrapper">
                <div class="contacto-info">
                    <h2>¿Hablamos?</h2>
                    <p>Estamos listos para impulsar tu proyecto. Escríbenos o visítanos en nuestras oficinas.</p>
                    
                    <div class="datos-directos">
                        <p> Calle Tecnologico Superior Campus Valladolid</p>
                        <p> +52 985-148-3684</p>
                        <p> hola@empresaweb.com</p>
                    </div>
                </div>

                <div class="contacto-form">
                    <form action="#" method="post">
                        <div class="form-group">
                            <label for="nombre">Nombre Completo</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form-group">
                            <label for="telefono">Número telefónico</label>
                            <input type="tel" id="telefono" name="telefono" 
                                   pattern="[0-9]{10}" title="Ingresa 10 dígitos" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="mensaje">¿En qué podemos ayudarte?</label>
                            <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                        </div>

                        <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 Empresa Web </p>
    </footer>

</body>
</html>
